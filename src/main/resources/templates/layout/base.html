<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="page(title, active, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#30251F">
    <title th:text="${title} + ' | Essenza Gold'">Essenza Gold</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="appSidebar">
        <a class="brand-lockup" th:href="@{/}">
            <span class="brand-mark"><i class="bi bi-flower1"></i></span>
            <span><strong>ESSENZA</strong><small>GOLD · PERFUMERÍA</small></span>
        </a>
        <div class="sidebar-caption">MENÚ PRINCIPAL</div>
        <nav class="side-nav" aria-label="Navegación principal">
            <a th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'active' : ''"><i class="bi bi-grid-1x2"></i><span>Resumen</span></a>
            <a th:href="@{/productos}" th:classappend="${active == 'productos'} ? 'active' : ''"><i class="bi bi-droplet"></i><span>Productos</span></a>
            <a th:href="@{/ventas}" th:classappend="${active == 'ventas'} ? 'active' : ''"><i class="bi bi-bag-heart"></i><span>Ventas</span></a>
            <a th:href="@{/compras}" th:classappend="${active == 'compras'} ? 'active' : ''"><i class="bi bi-box-seam"></i><span>Compras</span></a>
            <a th:href="@{/proveedores}" th:classappend="${active == 'proveedores'} ? 'active' : ''"><i class="bi bi-building"></i><span>Proveedores</span></a>
            <a th:href="@{/devoluciones}" th:classappend="${active == 'devoluciones'} ? 'active' : ''"><i class="bi bi-arrow-return-left"></i><span>Devoluciones</span></a>
            <a th:href="@{/usuarios}" th:classappend="${active == 'usuarios'} ? 'active' : ''"><i class="bi bi-people"></i><span>Usuarios</span></a>
        </nav>
        <div class="sidebar-note">
            <i class="bi bi-stars"></i>
            <p>La esencia de cada momento.</p>
        </div>
        <div class="sidebar-footer">GESTIÓN DE PERFUMERÍA <span>© ESSENZA GOLD</span></div>
    </aside>

    <div class="main-column">
        <header class="topbar">
            <button class="icon-button mobile-menu" type="button" aria-label="Abrir menú" data-sidebar-toggle>
                <i class="bi bi-list"></i>
            </button>
            <div class="topbar-context"><span>ESSENZA GOLD</span><i class="bi bi-chevron-right"></i><strong th:text="${title}">Resumen</strong></div>
            <div class="topbar-actions"><span class="topbar-status"><i></i> Sistema de gestión</span><span class="topbar-avatar"><i class="bi bi-person"></i></span></div>
        </header>
        <main class="page-content" th:replace="${content}">
            <section class="content-card"></section>
        </main>
        <footer class="app-footer"><span>ESSENZA GOLD</span><span>Una experiencia que permanece.</span></footer>
    </div>
</div>
<div class="sidebar-scrim" data-sidebar-toggle></div>
<div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
